<div [class]="'alert ' + nivel">
  @switch (nivel) {
    @case ('warn') {
      <svg class="ic" viewBox="0 0 20 20" fill="none"><path d="M10 2.8 18 17H2L10 2.8Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M10 8v4M10 14.4v.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    }
    @case ('bad') {
      <svg class="ic" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7.5" stroke="currentColor" stroke-width="1.6"/><path d="M7 7l6 6M13 7l-6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    }
    @case ('good') {
      <svg class="ic" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7.5" stroke="currentColor" stroke-width="1.6"/><path d="M6.6 10.4l2.4 2.4 4.4-5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    }
    @default {
      <svg class="ic" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7.5" stroke="currentColor" stroke-width="1.6"/><path d="M10 9v4.6M10 6.4v.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    }
  }
  <div>
    <h3>{{titulo}}</h3>
    <p><ng-content/></p>
  </div>
</div>
